name: Tests C++ et couverture

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v5

      - name: Installer MSYS2 et les dependances
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-catch
            mingw-w64-ucrt-x86_64-glfw
            mingw-w64-ucrt-x86_64-gcovr

      - name: Configurer CMake avec la couverture
        run: >-
          cmake -S . -B build-ci -G Ninja
          -DBUILD_TESTING=ON
          -DENABLE_COVERAGE=ON
          -DCMAKE_BUILD_TYPE=Debug

      - name: Compiler tout le projet
        run: cmake --build build-ci

      - name: Executer les tests selon la branche
        id: tests
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          TARGET_BRANCH: ${{ github.base_ref }}
        run: |
          args=()

          if [[ "$BRANCH_NAME" == "main" || "$TARGET_BRANCH" == "main" ]]; then
            echo "Execution de tous les tests"
          else
            case "$BRANCH_NAME" in
              ML|ML/*)
                echo "Execution des tests ML"
                args=(-L '^ml$')
                ;;
              feature|feature/*|TrackEditor)
                echo "Execution des tests circuits et editeur"
                args=(-L '^(track|editor)$')
                ;;
              *)
                echo "Execution de tous les tests"
                ;;
            esac
          fi

          ctest --test-dir build-ci \
                --output-on-failure \
                --no-tests=error \
                "${args[@]}"

      - name: Generer le rapport de couverture
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: |
          mkdir -p coverage
          gcovr --root . \
                --filter 'src/' \
                --filter 'include/' \
                --exclude 'src/glad\.c$' \
                --exclude 'include/glad/' \
                --exclude 'include/glm/' \
                --exclude 'include/KHR/' \
                --html-details coverage/index.html \
                build-ci

      - name: Publier le rapport en artefact
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: rapport-couverture
          path: coverage/
          retention-days: 14
          if-no-files-found: error